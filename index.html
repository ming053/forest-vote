<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>봉인된 숲속 투표소 구출 작전</title>
<style>
:root{
  --bg:#eef6ea; --card:#ffffff; --ink:#1f3328; --muted:#5d7365; --line:#dbe8d5;
  --green:#2e9e5b; --r1:#2e9e5b; --r2:#2f7fd8; --r3:#e8862b; --r4:#8a5cd6;
  --gold:#f2b01e; --red:#e2483d; --shadow:0 6px 20px rgba(31,51,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:radial-gradient(circle at 10% 0%,#dff0d4 0,transparent 40%),radial-gradient(circle at 100% 100%,#e4f1dc 0,transparent 45%);
  background-attachment:fixed; overscroll-behavior:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; line-height:1.55; font-size:17px;
}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font-family:inherit}
.hidden{display:none!important}

/* ===== 상단 바 ===== */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.hbar{max-width:920px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:28px}
.brand .t{font-weight:800;font-size:15px;line-height:1.2}
.brand .g{display:inline-block;margin-top:2px;background:var(--green);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.brand .g.none{background:#b9c7bd}
.progress{display:flex;gap:6px;justify-content:center}
.seg{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px}
.seg .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#eef2ec;border:2px solid #d4ddd0;color:#9aa99f;transition:.3s}
.seg .lb{font-size:11.5px;color:var(--muted);font-weight:700}
.seg.now .dot{border-color:var(--c);background:#fff;color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.seg.done .dot{background:var(--c);border-color:var(--c);color:#fff}
.right{display:flex;align-items:center;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;padding:6px 14px;border-radius:12px;background:#f1f7ee;border:2px solid var(--line);min-width:104px;text-align:center}
.timer small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:-3px}
.timer.warn{color:#c76a00;border-color:#f4c27a;background:#fff6e8}
.timer.danger{color:var(--red);border-color:#f2a59f;background:#fff0ef;animation:pulse 1s infinite}
.timer.finish{color:var(--green);border-color:#9ed6b3}
.reset{border:none;background:none;font-size:20px;color:#9aa99f;padding:6px}
@keyframes pulse{50%{transform:scale(1.05)}}
.pct{height:4px;background:#e5ece2}
.pct i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4));transition:width .6s}

main{max-width:920px;margin:0 auto;padding:20px 16px 60px}

/* ===== 공통 카드 ===== */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px;margin-bottom:16px}
.btn{border:none;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:800;background:#e7efe4;color:var(--ink);transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--rc,var(--green));color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--rc,var(--green)) 70%,#000)}
.btn.big{font-size:20px;padding:16px 30px}
.btn:disabled{filter:grayscale(.7) opacity(.6);cursor:not-allowed}

/* ===== 시작 화면 ===== */
.hero{text-align:center;padding:30px 22px}
.hero .emo{font-size:52px;letter-spacing:6px}
.hero h1{font-size:30px;margin:8px 0 6px;line-height:1.3}
.hero p{color:var(--muted)}
.story-intro{background:#f7fbf4;border:1px dashed #b9d6ad;border-radius:16px;padding:16px 18px;text-align:left;margin:18px 0}
.story-intro b{color:var(--green)}
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 20px}
.gbtn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 0;font-size:19px;font-weight:800;color:var(--ink)}
.gbtn.sel{border-color:var(--green);background:var(--green);color:#fff;box-shadow:0 4px 0 #1f7442}
.gbtn.demo{grid-column:1/-1;font-size:16px;padding:10px 0;border-style:dashed;color:var(--muted)}
.gbtn.demo.sel{border-style:solid;color:#fff;background:#5d7365;border-color:#5d7365;box-shadow:0 4px 0 #3f5246}
.gcard.demo{border-style:dashed;background:#f7f9f6}
.rules{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;font-size:14px;color:var(--muted)}
.rules span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}

/* ===== 방 ===== */
.roomhead{display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:20px;color:#fff;background:var(--rc);margin-bottom:16px;box-shadow:var(--shadow)}
.roomhead .ic{font-size:40px;background:rgba(255,255,255,.2);width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex-shrink:0}
.roomhead .no{font-size:14px;opacity:.9;font-weight:700}
.roomhead h2{font-size:25px;line-height:1.25}
.scene .lead{font-size:17px;margin-bottom:12px}
.sign{background:#fff8e1;border:2px solid #f0d58a;border-radius:14px;padding:12px 16px;font-weight:800;text-align:center;margin:10px 0 14px;font-size:18px}
.sign small{display:block;font-weight:600;color:#8a6d1a;font-size:13px}
.say{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.av{flex-shrink:0;width:50px;height:50px;border-radius:50%;background:#f1f5ee;display:grid;place-items:center;font-size:30px;border:2px solid var(--line)}
.av.t{font-size:17px;font-weight:900;color:#fff;border:none}
.bubble{background:#f4f8f2;border-radius:4px 16px 16px 16px;padding:10px 14px;position:relative}
.bubble .nm{font-size:13px;font-weight:800;color:var(--muted);display:block}
.mission{margin-top:14px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--rc) 10%,#fff);color:color-mix(in srgb,var(--rc) 80%,#000);font-weight:800;font-size:15.5px}

.done-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.done-chips span{background:#e9f6ee;color:#1f7442;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}

.qcard{border:2px solid color-mix(in srgb,var(--rc) 35%,#fff);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.qlabel{display:inline-block;background:var(--rc);color:#fff;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:800;margin-bottom:10px}
.qtext{font-size:20px;font-weight:800;margin-bottom:14px;line-height:1.45}
.arow{display:flex;gap:10px}
.arow input{flex:1;min-width:0;font-size:20px;padding:13px 16px;border:2px solid var(--line);border-radius:14px;outline:none}
.arow input:focus{border-color:var(--rc)}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600;color:var(--ink);display:flex;gap:12px;align-items:center}
.opt .n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#eef3eb;display:grid;place-items:center;font-weight:800;font-size:15px}
.opt.right{border-color:var(--green);background:#eaf7ef}
.opt.right .n{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fff1f0}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.hintbtn{border:2px dashed #e6c45c;background:#fffaea;color:#8a6a10;border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px}
.hint{width:100%;background:#fffaea;border-radius:12px;padding:10px 14px;color:#6f560c;font-weight:700}
.msg{width:100%;font-weight:800;min-height:0}
.msg.ok{color:var(--green)}
.msg.no{color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.after{margin-top:14px;padding:14px 16px;border-radius:14px;background:#f2f8ff;border:1px solid #cfe1f7;animation:rise .4s}
.after.tip{background:#fff6ea;border-color:#f6d3a6}

/* 2번 방 표 세기 */
.tally{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.side{background:#f6f9f4;border-radius:14px;padding:12px}
.side-title{font-weight:800;font-size:15px;margin-bottom:8px}
.voters{display:flex;flex-wrap:wrap;gap:8px}
.voter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:26px;display:flex;align-items:center;gap:2px}
.voter i{font-style:normal;font-size:17px}
.bars{display:grid;gap:12px;margin-top:8px}
.bars h4{font-size:15px;margin-bottom:4px}
.bar{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:3px 0}
.bar .lbl{width:104px;flex-shrink:0;white-space:nowrap}
.bar .fill{height:22px;border-radius:6px;background:#c7d5c9;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:13px;transition:width .8s}
.bar .fill.win{background:var(--r2)}

/* 4번 방 결과 비교 */
.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.res{border-radius:16px;padding:14px;border:2px solid var(--line);background:#fafcf9}
.res h4{font-size:16px;margin-bottom:8px}
.res .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700}
.res .row:last-of-type{border:none}
.res .row b{font-size:22px}
.res .win{margin-top:8px;text-align:center;font-weight:800;border-radius:10px;padding:5px;background:#eef3eb}
.res.secret{border-color:color-mix(in srgb,var(--r4) 45%,#fff);background:#f8f4ff}
.res.secret .win{background:var(--r4);color:#fff}
.vs-note{text-align:center;font-weight:800;color:var(--r4);margin:-4px 0 14px}

/* 단서 카드 */
.clue{text-align:center;padding:30px 22px;border:3px solid var(--gold);background:linear-gradient(160deg,#fffdf3,#fff6d6);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.clue .k{font-size:54px}
.clue h3{font-size:22px;margin:4px 0 4px}
.clue .principle{display:inline-block;margin:6px 0 14px;background:var(--rc);color:#fff;font-weight:800;padding:4px 16px;border-radius:999px}
.clue blockquote{font-size:21px;font-weight:800;line-height:1.5;background:#fff;border-radius:14px;padding:16px;margin:0 auto 18px;max-width:560px;border-left:6px solid var(--rc);text-align:left}
.clue .note{color:var(--muted);font-size:14px;margin-bottom:16px}

/* 최종 봉인 */
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 16px}
.chip{border:none;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:800;color:#fff;background:var(--cc);box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 65%,#000);transition:.15s}
.chip.sel{transform:translateY(-4px) scale(1.06);outline:4px solid color-mix(in srgb,var(--cc) 35%,#fff)}
.slots{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;width:100%;font-size:16.5px;font-weight:600;color:var(--ink)}
.slot .sit{flex:1}
.slot .put{flex-shrink:0;min-width:104px;text-align:center;border:2px dashed #c3d0c6;border-radius:12px;padding:8px 10px;font-weight:800;color:#9aa99f}
.slot .put.filled{border-style:solid;color:#fff;background:var(--cc);border-color:var(--cc)}
.slot.bad{border-color:var(--red);background:#fff1f0}
.slot.good{border-color:var(--green);background:#eaf7ef}
.guide{text-align:center;color:var(--muted);font-weight:700;margin-bottom:6px}

/* 성공 화면 */
.win-title{text-align:center;padding:26px 18px 8px}
.win-title .emo{font-size:56px}
.win-title h1{font-size:28px;line-height:1.35;margin:6px 0}
.win-title h1 em{font-style:normal;color:var(--green)}
.cert{position:relative;background:#fffdf5;border:10px double #c9a646;border-radius:10px;padding:30px 26px;text-align:center;margin:18px 0;box-shadow:var(--shadow)}
.cert .ct{font-size:13px;letter-spacing:6px;color:#9c7f2a;font-weight:800}
.cert h2{font-size:32px;margin:6px 0 12px;letter-spacing:4px}
.cert .who{font-size:26px;font-weight:900;margin-bottom:12px}
.cert p{font-size:17px;line-height:1.8}
.cert .badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.cert .badges span{color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:15px}
.cert .meta{color:var(--muted);font-size:14.5px;margin-top:6px}
.cert .stamp{position:absolute;right:22px;bottom:18px;width:84px;height:84px;border:4px solid #d0473b;border-radius:50%;color:#d0473b;display:grid;place-items:center;font-weight:900;font-size:13px;line-height:1.25;transform:rotate(-14deg);opacity:.85;text-align:center}
.notice{background:#1f3328;color:#fff;border-radius:20px;padding:22px;text-align:center;margin:18px 0}
.notice .i{font-size:40px}
.notice p{font-size:20px;font-weight:800;line-height:1.55}
.notice p em{font-style:normal;color:#ffd75e}
.cluelist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cluelist div{background:#fff;border-radius:14px;border-left:6px solid var(--rc);padding:12px 14px;border:1px solid var(--line);border-left-width:6px}
.cluelist b{display:block;font-size:14px;color:var(--rc)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}

/* 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(20,35,26,.55);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ovbox{background:#fff;border-radius:24px;padding:30px 26px;text-align:center;max-width:420px;width:100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ovbox .big{font-size:64px}
.ovbox h3{font-size:24px;margin:6px 0 8px}
.ovbox p{color:var(--muted);margin-bottom:16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.brand .logo{cursor:default;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.timer.paused{color:#5d7365;border-color:#c3d0c6;background:#eef2ec}
#pauseCover{position:fixed;inset:0;z-index:70;background:rgba(20,35,26,.72);display:grid;place-items:center;padding:20px}
#pauseCover .ovbox h3{font-size:26px}
body.paused header{z-index:75}
/* 선생님 모드 */
#tLogin,#tPanel{position:fixed;inset:0;z-index:90;background:rgba(15,28,20,.6);display:grid;place-items:center;padding:16px}
#tLogin .ovbox input{width:100%;font-size:26px;text-align:center;letter-spacing:10px;padding:12px;border:2px solid var(--line);border-radius:14px;margin:6px 0 10px;outline:none}
#tLogin .ovbox input:focus{border-color:#1f3328}
.tbox{background:#fff;border-radius:22px;width:100%;max-width:820px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.thead{position:sticky;top:0;background:#1f3328;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.thead h3{flex:1;font-size:19px}
.thead button{border:none;background:#ffd75e;color:#1f3328;font-weight:800;border-radius:10px;padding:8px 14px;font-size:15px}
.ttabs{display:flex;gap:6px;padding:12px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:52px;background:#fff;z-index:1}
.ttabs button{border:none;background:none;padding:10px 14px;font-weight:800;font-size:16px;color:var(--muted);border-bottom:3px solid transparent}
.ttabs button.on{color:#1f3328;border-color:#1f3328}
.tbody{padding:16px 18px 22px}
.tsec{margin-bottom:20px}
.tsec h4{font-size:16px;margin-bottom:8px}
.tsec .sub{font-size:13.5px;color:var(--muted);font-weight:600;margin:-4px 0 8px}
.tgrid{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;color:var(--ink)}
.tbtn.on{background:#1f3328;color:#fff;border-color:#1f3328}
.tbtn.warn{border-color:#f2a59f;color:var(--red)}
.tbtn.danger{background:var(--red);border-color:var(--red);color:#fff}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kv div{background:#f4f8f2;border-radius:12px;padding:10px 12px}
.kv small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.kv b{font-size:18px}
table.tt{width:100%;border-collapse:collapse;font-size:15px}
table.tt th,table.tt td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.tt th{background:#f4f8f2;font-size:13.5px;color:var(--muted)}
.tmsg{font-weight:800;color:var(--green);min-height:22px;margin-top:6px}
.net{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;background:#3a5545;color:#cfe;white-space:nowrap}
.net.ok{background:#2e9e5b;color:#fff}.net.bad{background:#e2483d;color:#fff}
.ctlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f4f8f2;border-radius:14px;padding:12px;margin-bottom:14px}
.ctlbar .state{font-weight:900;font-size:16px;margin-right:6px}
.tbtn.go{background:var(--green);border-color:var(--green);color:#fff}
.tbtn.stop{background:#c76a00;border-color:#c76a00;color:#fff}
.tbtn.big{font-size:17px;padding:12px 18px}
.gboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.gcard.alert{border-color:#f4c27a;background:#fffaf0}
.gcard.fin{border-color:#9ed6b3;background:#f3fbf6}
.gcard h5{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.gcard h5 small{font-size:12.5px;color:var(--muted);font-weight:700}
.drow{display:flex;gap:6px;align-items:center;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:none}
.drow .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.drow .st{font-weight:800;flex:1}
.drow .mt{color:var(--muted);font-weight:600;white-space:nowrap}
.drow.off{opacity:.45}
.drow .wa{color:#c76a00;font-weight:900}
.empty{color:#9aa99f;font-size:13.5px;padding:6px 0}
.gmove{display:flex;gap:6px;margin-top:8px}
.gmove select{flex:1;min-width:0;font-size:15px;padding:8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-family:inherit}
.setup{background:#fff8e1;border:1px solid #f0d58a;border-radius:14px;padding:14px 16px;line-height:1.7;font-size:15px}
@media (max-width:720px){.gboard{grid-template-columns:1fr}}
@media (max-width:720px){.kv{grid-template-columns:1fr 1fr}}


@media (max-width:720px){
  .hbar{grid-template-columns:1fr auto;gap:8px}
  .progress{grid-column:1/-1;order:3}
  .seg{min-width:0;flex:1}
  .seg .dot{width:30px;height:30px;font-size:14px}
  .brand .t{font-size:14px}
  .timer{font-size:19px;min-width:90px}
  .hero h1{font-size:24px}
  .groups{grid-template-columns:repeat(4,1fr)}
  .tally,.results,.cluelist{grid-template-columns:1fr}
  .qtext{font-size:18px}
  .roomhead h2{font-size:21px}
  .slot{flex-wrap:wrap}
  .slot .put{width:100%}
}
@media print{
  body{background:#fff}

  else { b.textContent = "모둠 미선택"; b.classList.add("none"); }

  var labels = ROOMS.map(function(r,i){return {lb:(S.startAt && i<S.room)?r.key:(i+1)+'번 방', c:r.color, ic:r.icon};});
  labels.push({lb:"봉인", c:"#c9a646", ic:"🔓"});
  var h = "";
  labels.forEach(function(l,i){
    var cls = "seg";
    var started = !!S.startAt;
    if(started && i < S.room) cls += " done";
    else if(started && i === S.room) cls += " now";
    var dot = (started && i < S.room) ? "✓" : (i===4 ? "🔒" : (i+1));
    if(started && i===S.room) dot = l.ic;
    h += '<div class="'+cls+'" style="--c:'+l.c+'"><div class="dot">'+dot+'</div><div class="lb">'+l.lb+'</div></div>';
  });
  document.getElementById("progress").innerHTML = h;

  var pct = 0;
  if(S.startAt){
    var stepFrac = {q1:0, q2:0.33, q2b:0.6, clue:0.85}[S.step] || 0;
    pct = Math.min(100, ((S.room + (S.room<4?stepFrac:0)) / 5) * 100);
    if(S.room>=5) pct = 100;
  }
  document.getElementById("pctbar").style.width = pct+"%";
}

function fmt(ms){ var s=Math.max(0,Math.ceil(ms/1000)); var m=Math.floor(s/60); s%=60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function tick(){
  var t = document.getElementById("timer"), v = document.getElementById("tval");
  t.className = "timer";
  var pz = !!S.paused;
  document.getElementById("pauseCover").classList.toggle("hidden", !pz);
  document.body.classList.toggle("paused", pz);
  if(!S.startAt){ v.textContent = fmt(TOTAL_MS); return; }
  if(S.finishedAt){ v.textContent = "완료 ✓"; t.classList.add("finish"); return; }
  var left = leftMs();
  if(S.paused){ v.textContent = "⏸ "+fmt(left); t.classList.add("paused"); return; }
  v.textContent = fmt(left);
  if(left <= 60000) t.classList.add("danger");
  else if(left <= 180000) t.classList.add("warn");

/* ================= 폭죽 ================= */
var cv = document.getElementById("confetti"), cx = cv.getContext("2d"), parts = [], raf = null;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", sizeCv); sizeCv();
function burst(x, y){
  var cols = ["#2e9e5b","#2f7fd8","#e8862b","#8a5cd6","#f2b01e","#e2483d"];
  for(var i=0;i<70;i++){
    var a = Math.random()*Math.PI*2, sp = 3+Math.random()*7;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:90+Math.random()*50,c:cols[i%cols.length],s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3});
  }
}
function confetti(){
  var w = innerWidth, h = innerHeight, n = 0;
  var iv = setInterval(function(){
    burst(w*(0.15+Math.random()*0.7), h*(0.15+Math.random()*0.35));
    if(++n >= 6) clearInterval(iv);
  }, 350);
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(function(p){ return p.life > 0; });
  parts.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.vx *= 0.99; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life/40);
    cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();
  });
  if(parts.length) raf = requestAnimationFrame(loop);
  else { raf = null; cx.clearRect(0,0,cv.width,cv.height); }
}

(function(){
  var logo = document.getElementById("logo"), taps = [], holdT = null;
  logo.addEventListener("click", function(){
    var n = Date.now(); taps = taps.filter(function(t){ return n - t < 2000; }); taps.push(n);
    if(taps.length >= 5){ taps = []; openLogin(); }
  });
  logo.addEventListener("pointerdown", function(){ holdT = setTimeout(function(){ holdT = null; openLogin(); }, 2000); });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ logo.addEventListener(ev, function(){ if(holdT){ clearTimeout(holdT); holdT = null; } }); });
})();

function openLogin(){
  if(T.open || document.getElementById("tLogin")) return;
  var d = document.createElement("div"); d.id = "tLogin";
  d.innerHTML = '<div class="ovbox"><div class="big">🔐</div><h3>선생님 모드</h3><p>비밀번호를 입력하세요.</p>'+
    '<input id="tPw" type="password" inputmode="numeric" autocomplete="off" maxlength="12">'+
    '<div class="msg no" id="tPwMsg" style="min-height:24px"></div>'+
    '<div class="actions"><button class="btn" id="tCancel">취소</button><button class="btn primary" id="tOk">들어가기</button></div></div>';
  document.body.appendChild(d);
  var inp = document.getElementById("tPw"); setTimeout(function(){ inp.focus(); }, 50);
  function close(){ if(d.parentNode) d.parentNode.removeChild(d); }
  function ok(){
    if(inp.value === TEACHER_PW){ close(); T.open = true; T.tab = (NET.status === "off" ? "this" : "board"); T.confirmReset = false; T.msg = ""; renderTeacher(); }
    else { inp.value = ""; document.getElementById("tPwMsg").textContent = "비밀번호가 맞지 않아요."; }
  }
  document.getElementById("tCancel").onclick = close;
  document.getElementById("tOk").onclick = ok;
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") ok(); });
}

function closeTeacher(){ T.open = false; tRoot.innerHTML = ""; }

var STEP_TXT = {q1:"미션 1", q2:"미션 2", q2b:"미션 3", clue:"단서 카드"};
function stageOf(room, step, started){
  if(!started) return "시작 전";
  if(room >= 5) return "🎉 완료";
  if(room === 4) return "🔓 최종 봉인";
  return (room+1)+"번 방 · "+(STEP_TXT[step]||"");
}
function stageText(){
  if(!S.startAt) return "시작 전";
  if(S.room >= 5) return "🎉 모두 완료";
  if(S.room === 4) return "🔓 최종 봉인";
  var st = {q1:"미션 1 (원칙 이름 쓰기)", q2:"미션 2 (생각해 보기)", q2b:"미션 3 (숨겨진 마음)", clue:"단서 카드 확인"}[S.step] || "";
  return (S.room+1)+"번 방 · "+st;
}
function mmss(ms){ var s = Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+"분 "+(s%60)+"초"; }
function hintCount(){ var n = 0; for(var k in S.hints) n++; return n; }
var MOVE_OPTS = ROOMS.map(function(r,i){ return {v:i, t:(i+1)+"번 "+r.room}; }).concat([{v:4,t:"최종 봉인"},{v:5,t:"완료 화면"}]);

/* ---------- 방 이동 (선생님 조작 공통) ---------- */
function jumpTo(i, remote){
  if(!S.group) return;
  if(!S.startAt){ S.startAt = Date.now(); S.joinedAt = S.joinedAt || Date.now(); }
  S.room = i; S.step = "q1"; lockUntil = 0; finalPlace = {}; selectedChip = null;
  for(var k=0;k<5;k++){ if(k >= i) S.doneAt[k] = null; else if(S.doneAt[k] == null) S.doneAt[k] = elapsedMs(); }
  if(i === 5){ if(S.doneAt[4] == null) S.doneAt[4] = elapsedMs(); if(S.pausedAt){ S.startAt += Date.now()-S.pausedAt; S.pausedAt = null; } S.finishedAt = Date.now(); }
  else { S.finishedAt = null; if(S.paused && !S.pausedAt) S.pausedAt = Date.now(); }
  save(); render(); tick(); window.scrollTo(0,0);
  if(remote){
    var nm = MOVE_OPTS.filter(function(o){ return o.v === i; })[0].t;
    overlay('<div class="big">🧑‍🏫</div><h3>선생님이 이동시켰어요</h3><p><b>'+nm+'</b>(으)로 이동합니다.</p>', 1800);
  }
  if(i === 5) confetti();
}
function localReset(){
  try{ localStorage.removeItem(STORE); }catch(e){}
  S = freshKeep(); pickedGroup = null; finalPlace = {}; selectedChip = null; lockUntil = 0;
  document.querySelectorAll(".overlay").forEach(function(o){ o.parentNode.removeChild(o); });
  save(); render(); tick(); window.scrollTo(0,0);
}

/* ================= 태블릿 연결 (Firebase) ================= */
function fbRef(p){ return NET.db.ref(FB_ROOT + (p ? "/"+p : "")); }
function serverNow(){ return Date.now() + NET.offset; }
function pushDevice(){
  if(NET.status !== "ok" || !S.startAt || !S.group) return;
  var hasStarted = !!S.startAt;
  fbRef("devices/"+DEVICE_ID).set({
    g:S.group, room:S.room, step:S.step, el:elapsedMs(), since:S.stageSince||0,
    wr:S.wrongs.reduce(function(a,b){return a+b;},0), hi:hintCount(), fin:!!S.finishedAt,
    joined:S.joinedAt||0, on:true, ts:firebase.database.ServerValue.TIMESTAMP
  }).catch(function(){});
}
function loadScript(src){ return new Promise(function(res, rej){ var sc = document.createElement("script"); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
function netInit(){
  var cfg = window.__FB_TEST_CONFIG || FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL) { NET.status = "off"; return; }
  NET.status = "connecting";
  var V = "https://www.gstatic.com/firebasejs/10.12.2/";
  var ready = window.firebase ? Promise.resolve() : loadScript(V+"firebase-app-compat.js").then(function(){ return loadScript(V+"firebase-database-compat.js"); });
  ready.then(function(){
    firebase.initializeApp(cfg);
    NET.db = firebase.database();
    NET.db.ref(".info/serverTimeOffset").on("value", function(sn){ NET.offset = sn.val() || 0; });
    NET.db.ref(".info/connected").on("value", function(sn){
      var ok = sn.val() === true;
      NET.status = ok ? "ok" : "connecting";
      if(ok){ fbRef("devices/"+DEVICE_ID).onDisconnect().update({on:false}); pushDevice(); }
      if(T.open) renderTeacher();
    });
    fbRef("control").on("value", function(sn){ onControl(sn.val() || {}); });
    fbRef("commands").on("value", function(sn){ onCommands(sn.val() || {}); });
    fbRef("devices").on("value", function(sn){ NET.devices = sn.val() || {}; if(T.open) refreshTeacher(); });
    setInterval(pushDevice, 10000);
  }).catch(function(){ NET.status = "fail"; if(T.open) renderTeacher(); });
}
function onControl(c){
  var prevExtra = (NET.control && NET.control.extraMs) || 0;
  NET.control = c;
  var rs = c.reset || 0;
  if(S.resetSeen == null){ S.resetSeen = rs; save(); }
  else if(S.resetSeen !== rs && rs){ S.resetSeen = rs; localReset(); fbRef("devices/"+DEVICE_ID).remove().catch(function(){}); }
  syncPause();
  if((c.extraMs||0) !== prevExtra && leftMs() > 0) S.timeUpSeen = false;
  tick();
  if(T.open) renderTeacher();
}
function syncPause(){
  if(NET.status !== "ok") return;
  var want = !!(NET.control && NET.control.paused) && S.group !== DEMO;
  if(want !== !!S.paused) applyPause(want);
}
function onCommands(cm){
  NET.commands = cm;
  if(!S.startAt || !S.group) return;
  var c = cm[S.group];
  if(c && c.n && c.n !== S.cmdSeen){ S.cmdSeen = c.n; jumpTo(c.room, true); }
}

/* ---------- 선생님: 모둠 현황판 ---------- */
function devicesOf(g){
  var arr = [];
  for(var id in NET.devices){ var d = NET.devices[id]; if(d && d.g === g){ d.id = id; arr.push(d); } }
  arr.sort(function(a,b){ return (a.joined||0) - (b.joined||0); });
  return arr;
}
function isOnline(d){ return d.on !== false && serverNow() - (d.ts||0) < 35000; }
function stageDur(d){
  var base = (d.el||0) - (d.since||0);
  if(!d.fin && !(NET.control && NET.control.paused) && isOnline(d)) base += Math.max(0, serverNow() - (d.ts||0));
  return base;
}
function groupRows(g){
  var ds = devicesOf(g);
  if(!ds.length) return '<div class="empty">아직 접속한 태블릿이 없어요</div>';
  return ds.map(function(d, k){
    var col = d.room >= 5 ? "#2e9e5b" : d.room === 4 ? "#c9a646" : ROOMS[d.room].color;
    var dur = stageDur(d), stuck = !d.fin && dur > 180000;
    return '<div class="drow'+(isOnline(d)?'':' off')+'"><span class="d" style="background:'+col+'"></span>'+
      '<span class="st">'+(k+1)+'번 기기 · '+stageOf(d.room, d.step, true)+'</span>'+
      '<span class="mt">'+(d.fin ? '' : (stuck?'<span class="wa">⚠ </span>':'')+Math.floor(dur/60000)+'분째 · ')+'오답 '+(d.wr||0)+' · 힌트 '+(d.hi||0)+(isOnline(d)?'':' · 끊김')+'</span></div>';
  }).join("");
}
function groupClass(g){ return groupClass0(g) + (g === DEMO ? " demo" : ""); }
function groupClass0(g){
  var ds = devicesOf(g); if(!ds.length) return "gcard";
  if(ds.every(function(d){ return d.fin; })) return "gcard fin";
  if(ds.some(function(d){ return !d.fin && stageDur(d) > 180000; })) return "gcard alert";
  return "gcard";
}
function boardHTML(){
  if(NET.status === "off") return setupHTML();
  if(NET.status === "fail") return '<div class="setup">🔴 연결 서버를 불러오지 못했어요. 태블릿의 인터넷 연결을 확인한 뒤 새로고침해 주세요.<br>그동안에도 학생들은 각 태블릿에서 정상적으로 활동할 수 있어요. 이 태블릿만 조작하려면 <b>이 태블릿</b> 탭을 이용하세요.</div>';
  var c = NET.control || {}, paused = !!c.paused, ex = Math.round((c.extraMs||0)/60000);
  var cards = "";
  GLIST.forEach(function(g){
    var opts = MOVE_OPTS.map(function(o){ return '<option value="'+o.v+'"'+((T.sel[g]||0)==o.v?' selected':'')+'>'+o.t+'</option>'; }).join("");
    cards += '<div class="'+groupClass(g)+'" data-gcard="'+g+'"><h5>'+gName(g)+(g===DEMO?'<small style="flex:1;margin-left:6px">· 멈춤 영향 없음</small>':'')+'<small data-gcnt="'+g+'">'+devicesOf(g).length+'대 접속</small></h5>'+
      '<div data-grows="'+g+'">'+groupRows(g)+'</div>'+
      '<div class="gmove"><select data-gsel="'+g+'">'+opts+'</select><button class="tbtn" data-gmove="'+g+'">이동</button></div></div>';
  });
  return '<div class="ctlbar"><span class="state" id="tState">'+(paused?'⏸ 전체 멈춤 중':'▶ 진행 중')+'</span>'+
      '<button class="tbtn big '+(paused?'go':'stop')+'" id="gPause">'+(paused?'▶ 전체 진행':'⏸ 전체 멈춤')+'</button>'+
      '<button class="tbtn" data-gadd="1">+1분</button><button class="tbtn" data-gadd="3">+3분</button><button class="tbtn" data-gadd="-1">−1분</button>'+
      '<span class="sub" style="margin:0;font-size:13.5px;color:var(--muted);font-weight:700">추가 시간 '+(ex>=0?'+':'')+ex+'분</span></div>'+
    '<p class="sub" style="font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:10px">⚠ 표시는 한 단계에 3분 넘게 머문 기기예요. 이동을 누르면 그 모둠의 모든 태블릿이 선택한 방의 처음으로 이동해요.</p>'+
    '<div class="gboard">'+cards+'</div>'+
    '<div class="tsec" style="margin-top:18px"><h4>🧹 전체 초기화 (모든 태블릿)</h4><p class="sub">모든 태블릿의 진행 상황·시간이 지워지고 시작 화면으로 돌아가요. 다음 반 수업 전에 사용하세요.</p>'+
      '<button class="tbtn '+(T.confirmReset?'danger':'warn')+'" id="gReset">'+(T.confirmReset?'⚠️ 한 번 더 누르면 모든 태블릿이 초기화됩니다':'모든 태블릿 초기화')+'</button></div>'+
    '<div class="tmsg">'+T.msg+'</div>';
}
function setupHTML(){
  return '<div class="setup"><b>📡 모둠 현황판이 꺼져 있어요.</b><br>모든 모둠의 진행 상황을 한 화면에서 보고, 모둠별 이동과 전체 멈춤을 하려면 '+

/* ---------- 선생님: 이 태블릿 ---------- */
function statusHTML(){
  var rows = "", prev = 0;
  var names = ROOMS.map(function(r,i){ return (i+1)+"번 "+r.room+" <small style='color:var(--muted)'>("+r.name+")</small>"; });
  names.push("최종 봉인");
  for(var i=0;i<5;i++){
    var st, dur = "–";
    if(S.doneAt[i] != null){ st = "✅ 완료"; dur = mmss(S.doneAt[i] - prev); prev = S.doneAt[i]; }
    else if(S.startAt && S.room === i){ st = "▶ 진행 중"; dur = mmss(elapsedMs() - prev) + " 째"; }
    else st = "· 대기";
    var hints = 0; for(var k in S.hints) if(k.indexOf("r"+i+"q") === 0) hints++;
    rows += "<tr><td>"+names[i]+"</td><td>"+st+"</td><td>"+dur+"</td><td>"+S.wrongs[i]+"회</td><td>"+(i<4?hints+"개":"–")+"</td></tr>";
  }
  var left = S.startAt ? (S.finishedAt ? "완료" : (S.paused?"⏸ ":"")+fmt(leftMs())) : fmt(TOTAL_MS);
  return '<div class="kv"><div><small>모둠</small><b>'+(S.group?gName(S.group):"미선택")+'</b></div>'+
    '<div><small>현재 위치</small><b style="font-size:15px">'+stageText()+'</b></div>'+
    '<div><small>경과 시간</small><b>'+mmss(elapsedMs())+'</b></div>'+
    '<div><small>남은 시간</small><b>'+left+'</b></div></div>'+
    '<table class="tt"><tr><th>방</th><th>상태</th><th>걸린 시간</th><th>오답</th><th>힌트</th></tr>'+rows+'</table>';
}

function answerHTML(){
  var q2ans = ["③ 일정 나이 이상의 숲속 동물이라면 누구나 투표할 수 있음","② 사자 후보 승리 (6표 : 5표)","② 표범의 진짜 뜻과 다르게 투표될 수 있어서","③ 손들기 때는 눈치가 보여 진짜 마음과 다르게 손을 든 동물들이 있었기 때문에"];
  var rows = ROOMS.map(function(r,i){
    return "<tr><td><b>"+(i+1)+"번 "+r.room+"</b></td><td><b>"+r.name+"</b><br><small style='color:var(--muted)'>"+r.q1.answers.join(", ")+" 인정 (띄어쓰기 무시)</small></td><td>"+q2ans[i]+
      (i===3?"<br><b>미션 3:</b> 3 (마리)":"")+"</td></tr>";
  }).join("");
  var fin = FINAL.map(function(f){ return "<li>"+f.sit+" → <b>"+f.key+"선거</b></li>"; }).join("");
  return '<div class="tsec"><h4>🔑 방별 정답</h4><table class="tt"><tr><th>방</th><th>미션 1 (원칙 이름)</th><th>미션 2 · 3</th></tr>'+rows+'</table></div>'+
    '<div class="tsec"><h4>🔓 최종 봉인 연결</h4><ul style="padding-left:20px;line-height:1.9">'+fin+'</ul></div>'+
    '<div class="tsec"><h4>🗝️ 단서 카드 (배움책 19쪽 작성 근거)</h4><ul style="padding-left:20px;line-height:1.9">'+
      ROOMS.map(function(r){ return "<li><b>"+r.name+":</b> "+r.clue+"</li>"; }).join("")+'</ul></div>';
}

function netBadge(){
  return NET.status === "ok" ? '<span class="net ok">🟢 연결됨</span>' :
         NET.status === "connecting" ? '<span class="net">🟡 연결 중…</span>' :
         NET.status === "fail" ? '<span class="net bad">🔴 연결 실패</span>' : '<span class="net">⚪ 태블릿 단독</span>';
}

T.sel = {};
function renderTeacher(){
  if(!T.open) return;
  var ae = document.activeElement;
  if(ae && ae.tagName === "SELECT" && tRoot.contains(ae)) return;   // 고르는 중에는 다시 그리지 않음
  var sc = tRoot.querySelector(".tbox"); var top = sc ? sc.scrollTop : 0;
  var body = T.tab === "board" ? boardHTML() : T.tab === "this" ? thisHTML() : answerHTML();
  var tabs = [["board","모둠 현황판"],["this","이 태블릿"],["ans","정답표"]].map(function(t){ return '<button data-tab="'+t[0]+'" class="'+(T.tab===t[0]?"on":"")+'">'+t[1]+'</button>'; }).join("");
  tRoot.innerHTML = '<div id="tPanel"><div class="tbox"><div class="thead"><span style="font-size:22px">🧑‍🏫</span><h3>선생님 모드</h3>'+netBadge()+'<button id="tClose">학생 화면으로 ✕</button></div>'+
    '<div class="ttabs">'+tabs+'</div><div class="tbody">'+body+'</div></div></div>';
  tRoot.querySelector(".tbox").scrollTop = top;
  document.getElementById("tClose").onclick = closeTeacher;
  tRoot.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick = function(){ T.tab = b.getAttribute("data-tab"); T.confirmReset = false; T.msg = ""; tRoot.querySelector(".tbox").scrollTop = 0; renderTeacher(); }; });
  if(T.tab === "board") bindBoard();
  if(T.tab === "this") bindThis();
}
function refreshTeacher(){
  if(!T.open) return;
  if(T.tab === "board" && NET.status === "ok"){
    GLIST.forEach(function(g){
      var r = tRoot.querySelector('[data-grows="'+g+'"]'); if(r) r.innerHTML = groupRows(g);
      var c = tRoot.querySelector('[data-gcnt="'+g+'"]'); if(c) c.textContent = devicesOf(g).length+"대 접속";
      var cd = tRoot.querySelector('[data-gcard="'+g+'"]'); if(cd) cd.className = groupClass(g);
    });
  } else if(T.tab === "this"){
    var t = document.getElementById("tThis"); if(t) t.innerHTML = statusHTML();
  }
}
function bindBoard(){
  if(NET.status !== "ok") return;
  function msg(m){ T.msg = m; T.confirmReset = false; renderTeacher(); }
  document.getElementById("gPause").onclick = function(){
    var p = !(NET.control && NET.control.paused);
    fbRef("control").update({paused:p});
    msg(p ? "⏸ 모든 태블릿을 멈췄어요." : "▶ 모든 태블릿이 다시 진행돼요.");
  };
  tRoot.querySelectorAll("[data-gadd]").forEach(function(b){ b.onclick = function(){
    var m = +b.getAttribute("data-gadd");
    fbRef("control").update({extraMs: ((NET.control && NET.control.extraMs) || 0) + m*60000});
    msg("✓ 모든 태블릿의 시간을 "+(m>0?m+"분 늘렸어요.":(-m)+"분 줄였어요."));
  }; });
  tRoot.querySelectorAll("[data-gsel]").forEach(function(sel){ sel.onchange = function(){ T.sel[+sel.getAttribute("data-gsel")] = +sel.value; sel.blur(); }; });
  tRoot.querySelectorAll("[data-gmove]").forEach(function(b){ b.onclick = function(){
    var g = +b.getAttribute("data-gmove"), room = T.sel[g] || 0, n = devicesOf(g).length;
    if(!n){ msg(gName(g)+"에 접속한 태블릿이 없어요."); return; }
    fbRef("commands/"+g).set({room:room, n:Date.now()});
    var nm = MOVE_OPTS.filter(function(o){ return o.v === room; })[0].t;
    msg("✓ "+gName(g)+" 태블릿 "+n+"대를 "+nm+"(으)로 이동시켰어요.");
  }; });
  document.getElementById("gReset").onclick = function(){
    if(!T.confirmReset){ T.confirmReset = true; T.msg = ""; renderTeacher(); return; }
    fbRef("devices").remove(); fbRef("commands").remove();
    fbRef("control").set({paused:false, extraMs:0, reset:Date.now()});
    T.sel = {}; msg("✓ 모든 태블릿을 초기화했어요.");
  };
}
function bindThis(){
  function done(m){ T.msg = m; T.confirmReset = false; save(); render(); tick(); renderTeacher(); }
  tRoot.querySelectorAll("[data-tg]").forEach(function(b){ b.onclick = function(){
    S.group = +b.getAttribute("data-tg"); pickedGroup = S.group;
    var c0 = NET.commands && NET.commands[S.group]; S.cmdSeen = c0 && c0.n ? c0.n : 0;
    syncPause(); done("✓ "+gName(S.group)+"(으)로 바꿨어요.");
  }; });
  tRoot.querySelectorAll("[data-tr]").forEach(function(b){ b.onclick = function(){
    if(!S.group){ T.msg = "먼저 위에서 모둠을 선택해 주세요."; renderTeacher(); return; }
    jumpTo(+b.getAttribute("data-tr"), false);
    T.msg = "✓ "+b.textContent+"(으)로 이동했어요."; renderTeacher();
  }; });
  var tp = document.getElementById("tPause");
  if(tp) tp.onclick = function(){
    applyPause(!S.paused);
    done(S.paused ? "⏸ 이 태블릿을 멈췄어요. 학생 화면에 '잠시 멈춤'이 표시됩니다." : "▶ 다시 진행해요.");
  };
  tRoot.querySelectorAll("[data-tadd]").forEach(function(b){ b.onclick = function(){
    var m = +b.getAttribute("data-tadd");
    S.extraMs += m*60000; if(leftMs() > 0) S.timeUpSeen = false;
    done("✓ 시간을 "+(m>0?m+"분 늘렸어요.":(-m)+"분 줄였어요."));
  }; });
  var tr = document.getElementById("tTimeReset");
  if(tr) tr.onclick = function(){
    S.extraMs = 0; S.timeUpSeen = false;
    if(S.startAt){ S.startAt = Date.now(); if(S.pausedAt) S.pausedAt = S.startAt; }
    done("✓ 남은 시간을 15분으로 되돌렸어요.");
  };
  document.getElementById("tReset").onclick = function(){
    if(!T.confirmReset){ T.confirmReset = true; T.msg = ""; renderTeacher(); return; }
    if(NET.status === "ok") fbRef("devices/"+DEVICE_ID).remove().catch(function(){});
    localReset();
    T.confirmReset = false; T.msg = "✓ 이 태블릿을 초기화했어요."; renderTeacher();
  };
}
addEventListener("beforeunload", function(e){
  if(S.startAt && !S.finishedAt){ e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("contextmenu", function(e){ if(e.target.tagName !== "INPUT") e.preventDefault(); });

render(); tick(); netInit();
if(S.room === 5) setTimeout(confetti, 300);
})();
</script>
